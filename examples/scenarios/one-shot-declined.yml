name: one-shot-declined-magic-amount
description: |
  Refus au parcours utilisateur via montant magique. Un montant qui se
  termine par 01 en centimes force UNPAID au simulate, quel que soit
  l'outcome demandé — cf. docs/testing-cards.md, levier « Montant magique ».
steps:
  - action: create_payment
    provider: payzen
    amount: 1001
    currency: EUR
    order_id: ORDER-DECLINE-001
  - action: simulate
    status: captured
  - action: assert_state
    state: declined
    # Le montant decide aussi du motif : centimes 01 donne un 51,
    # provision insuffisante. C'est ce code que le marchand lit pour
    # savoir s'il peut reconduire — le figer ici evite qu'il se perde
    # en route sans que rien ne le signale.
    decline_code: "51"
  - action: assert_webhook
    count: 1
    outcome: UNPAID
