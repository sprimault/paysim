name: register-only
description: |
  Enrolement pur d'une carte — form_action REGISTER, amount 0.
  Le PSP ne debite rien : il cree juste un paymentMethodToken
  reutilisable pour des paiements one-click ulterieurs. Le
  vrai PayZen accepte ce mode ; Paysim l'accepte aussi depuis
  le fix qui autorise amount = 0 dans le domain (v0.4.4).

  Valide aussi la propagation de customer et metadata jusqu'au
  webhook emis — l'endpoint /paysim/api/v1/payments generique
  transmet ces champs au provider (fix v0.4.4).

  Etape finale : un charge_token avec un vrai montant prouve
  que le token enregistre est bien reutilisable.

  assert_payment_method controle la marque et les attributs du
  porteur tels qu'ils ont ete retenus a l'enrolement — la carte
  est une Mastercard pour que la verification soit discriminante.
steps:
  - action: create_payment
    provider: payzen
    amount: 0
    currency: EUR
    order_id: REGISTER-42
    form_action: REGISTER
    customer:
      email: alice@example.com
    metadata:
      plan: pro
      source: onboarding
    card:
      # Mastercard volontairement, pas une VISA : VISA est la valeur de
      # repli du kr-answer quand aucune marque n'est transmise. Un
      # scenario sur PAN 4xxx resterait vert meme si la marque se
      # perdait en route — il ne prouverait rien.
      pan: "5555555555554444"
      expiry_month: 12
      expiry_year: 2028
      # Attributs du porteur et de l'emetteur : ils remontent tels
      # quels dans cardDetails du kr-answer. Avant, ce bloc annoncait
      # une carte de credit francaise quoi qu'on enregistre.
      holder_name: DUPONT JEAN
      country: US
      product_category: DEBIT
      issuer_name: BANQUE DE TEST
  # Verifie ce qui a REELLEMENT ete enregistre. Sans cette etape, le
  # scenario prouvait seulement que l'enrolement n'echouait pas : les
  # quatre attributs ci-dessus pouvaient etre ignores en silence.
  - action: assert_payment_method
    brand: MASTERCARD
    pan_masked: "555555XXXXXX4444"
    holder_name: DUPONT JEAN
    country: US
    product_category: DEBIT
    issuer_name: BANQUE DE TEST
    usable: true
  - action: simulate
    status: captured
  - action: assert_state
    state: captured
  - action: assert_webhook
    count: 1
  - action: charge_token
    amount: 4990
    currency: EUR
    order_id: FIRST-CHARGE-42
  - action: assert_state
    state: captured
