name: subscription-monthly
description: |
  Abonnement mensuel natif PSP-driven — enrôlement, création de la
  subscription, deux échéances déclenchées manuellement, annulation.
  Pas de scheduler qui tourne en fond côté Paysim, chaque trigger_billing
  est explicite (déterminisme total). Cf. docs/subscriptions.md.
steps:
  - action: create_payment
    provider: payzen
    amount: 0
    currency: EUR
    order_id: INIT
    form_action: REGISTER
    card:
      pan: "4111111111111111"
      expiry_month: 12
      expiry_year: 2028
  - action: create_subscription
    amount: 2990
    currency: EUR
    order_id: SUB-42
    effect_date: "2026-09-01"
    rrule: "RRULE:FREQ=MONTHLY;INTERVAL=1"
    metadata:
      plan: pro
  - action: trigger_billing
  - action: assert_state
    state: captured
  - action: trigger_billing
  - action: assert_state
    state: captured
  - action: cancel_subscription
  - action: assert_subscription
    cancelled: true
