name: recurring-token
description: |
  Token pattern — le marchand enregistre une CB au premier paiement et
  déclenche lui-même le rejeu récurrent, mois après mois. Réponse
  synchrone captured/declined, pas de scheduler côté Paysim.
steps:
  - action: create_payment
    provider: payzen
    amount: 2990
    currency: EUR
    order_id: SUB-INIT
    form_action: REGISTER_PAY
    notification_url: http://merchant.local/ipn
    card:
      pan: "4111111111111111"
      expiry_month: 12
      expiry_year: 2028
  - action: simulate
    status: captured
  - action: assert_state
    state: captured
  - action: charge_token
    amount: 2990
    currency: EUR
    order_id: SUB-M2
    notification_url: http://merchant.local/ipn
  - action: assert_state
    state: captured
