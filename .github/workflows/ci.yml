# Intégration continue : ce qui était vérifié à la main avant chaque
# fusion tourne désormais sur chaque PR.
#
# Le front est construit avant toute compilation Go : internal/webui
# embarque dist/ via //go:embed et refuse de compiler si le répertoire
# est absent. Il est gitignoré, donc un clone frais ne l'a jamais — les
# cibles `make test` et `make lint` en dépendent déjà, on les réutilise
# telles quelles plutôt que de dupliquer la logique ici.
#
# Les actions sont épinglées au SHA de commit, le tag lisible en
# commentaire. Un tag de majeure comme `@v7` est mobile : il désigne un
# contenu qui change sans que ce dépôt bouge, donc du code tiers exécuté
# avec nos droits — dont `packages: write` sur le job `edge`. Une
# compromission de compte mainteneur suffirait à le repointer, et c'est
# le même risque que celui contre lequel nous refusons une version npm
# publiée le jour même. Le SHA, lui, ne se réécrit pas.
#
# Contrepartie assumée : les correctifs ne remontent plus seuls. Relever
# les versions est une opération manuelle, à faire délibérément — comme
# pour `golangci-lint`, épinglé pour que son verdict ne change jamais
# tout seul.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # L'audit des dépendances doit tourner même quand personne ne
  # contribue : une faille publiée en amont n'attend pas la prochaine PR.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Lecture seule : aucun job n'a besoin d'écrire sur le dépôt.
permissions:
  contents: read

# Une PR poussée plusieurs fois d'affilée n'a pas besoin de voir ses
# anciens runs finir.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  go:
    name: Go — lint et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Installer les dépendances du front
        run: npm ci
        working-directory: web

      # Version épinglée : un lint qui change de règles tout seul entre
      # deux exécutions transforme une PR verte en PR rouge sans que
      # rien n'ait bougé côté code.
      - name: Installer golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Lint
        run: make lint

      # -race exige cgo, activé explicitement : les images de runner
      # l'ont, mais CGO_ENABLED peut valoir 0 selon le contexte.
      - name: Tests
        run: make test
        env:
          CGO_ENABLED: '1'

  web:
    name: Front — lint et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installer les dépendances
        run: npm ci
        working-directory: web

      - name: Lint
        run: npm run lint
        working-directory: web

      - name: Tests
        run: npm run test:run
        working-directory: web

  # Job distinct des tests : une CVE publiée en amont n'a rien à voir
  # avec la PR en cours, et son échec ne doit pas se lire comme « ta
  # contribution est cassée ». Le check porte son propre nom, et le
  # déclencheur planifié le fait tourner même sans contribution.
  audit:
    name: Audit des dépendances du front
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installer les dépendances
        run: npm ci
        working-directory: web

      # Seuil `high` : les niveaux inférieurs produisent trop de bruit
      # pour un outil de développement qui ne traite aucune donnée
      # réelle. Même seuil que la cible `make web-test`.
      - name: Audit
        run: npm run audit:high
        working-directory: web

  scenarios:
    name: Scénarios canoniques (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Installer les dépendances du front
        run: npm ci
        working-directory: web

      - name: Construire le binaire
        run: make build

      # Récepteur jetable : sans cible qui répond, chaque livraison
      # échoue et l'historique ne reflète plus un parcours réaliste.
      - name: Démarrer un récepteur de webhooks
        run: |
          cat > /tmp/sink.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class H(BaseHTTPRequestHandler):
              def do_POST(self):
                  self.rfile.read(int(self.headers.get('Content-Length', 0)))
                  self.send_response(200)
                  self.end_headers()
              def log_message(self, *a):
                  pass
          HTTPServer(('127.0.0.1', 9099), H).serve_forever()
          PY
          python3 /tmp/sink.py &

      # SQLite plutôt que le mode mémoire : c'est le défaut de
      # deploy/compose.yml, et le mode où les défauts d'asynchronisme
      # se manifestent réellement — la course corrigée en v0.4.6 était
      # invisible en mémoire, donc invisible pour go test.
      - name: Démarrer Paysim
        run: |
          ./paysim &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              echo "Paysim répond après ${i} tentative(s)"
              exit 0
            fi
            sleep 1
          done
          echo "Paysim n'a pas démarré dans le délai imparti"
          exit 1
        env:
          PAYSIM_PUBLIC_URL: http://127.0.0.1:8080
          PAYSIM_CALLBACK_URL: http://127.0.0.1:9099
          PAYSIM_PAYZEN_HMAC_KEY: dev-hmac-key
          PAYSIM_STORE: sqlite
          PAYSIM_SQLITE_PATH: /tmp/paysim-ci.db
          PAYSIM_LOG_LEVEL: warn

      - name: Exécuter les scénarios
        run: |
          failed=0
          for f in examples/scenarios/*.yml; do
            if ./paysim run "$f"; then
              echo "OK    $(basename "$f")"
            else
              echo "ECHEC $(basename "$f")"
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "$failed scenario(s) en echec"
            exit 1
          fi
          echo "Tous les scenarios passent"
        env:
          PAYSIM_URL: http://127.0.0.1:8080

  # Image `edge` : l'état de master, publié à chaque fusion.
  #
  # Elle existe pour qu'un correctif soit installable sans passer par une
  # release. Publier une version a un coût — tag, notes, annonce — et le
  # payer pour chaque correctif produit une page de releases illisible où
  # l'urgent et l'accessoire se ressemblent.
  #
  #   :latest → dernière version stable, publiée à la main
  #   :edge   → état de master, mis à jour tout seul
  #
  # Multi-architecture comme `latest`, et pour la même raison : construire
  # les deux à chaque fusion garantit que l'arm64 compile toujours, au
  # lieu de le découvrir au moment d'une release. Le Dockerfile
  # cross-compile depuis la plateforme de build, donc aucune émulation
  # QEMU n'entre en jeu — le coût du second arc est marginal.
  edge:
    name: Image edge
    runs-on: ubuntu-latest
    # Seulement sur master : une PR ne doit jamais publier d'image.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # Rien ne part au registre tant que la validation n'est pas verte.
    needs: [go, web, audit, scenarios]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Se connecter au registre
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:edge
          # Sans ça, l'image ne dit pas de quel commit elle sort — le
          # défaut du Dockerfile (`unknown`) resterait en place.
          build-args: |
            REVISION=${{ github.sha }}
          # Le cache du registre évite de tout reconstruire à chaque
          # fusion — le front et les dépendances Go bougent rarement.
          cache-from: type=gha
          cache-to: type=gha,mode=max
