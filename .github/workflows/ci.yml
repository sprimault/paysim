# Intégration continue : ce qui était vérifié à la main avant chaque
# fusion tourne désormais sur chaque PR.
#
# Le front est construit avant toute compilation Go : internal/webui
# embarque dist/ via //go:embed et refuse de compiler si le répertoire
# est absent. Il est gitignoré, donc un clone frais ne l'a jamais — les
# cibles `make test` et `make lint` en dépendent déjà, on les réutilise
# telles quelles plutôt que de dupliquer la logique ici.
#
# Les actions sont épinglées au SHA de commit, le tag lisible en
# commentaire. Un tag de majeure comme `@v7` est mobile : il désigne un
# contenu qui change sans que ce dépôt bouge, donc du code tiers exécuté
# avec nos droits — dont `packages: write` sur le job `edge`. Une
# compromission de compte mainteneur suffirait à le repointer, et c'est
# le même risque que celui contre lequel nous refusons une version npm
# publiée le jour même. Le SHA, lui, ne se réécrit pas.
#
# Contrepartie assumée : les correctifs ne remontent plus seuls. Relever
# les versions est une opération manuelle, à faire délibérément — comme
# pour `golangci-lint`, épinglé pour que son verdict ne change jamais
# tout seul.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # L'audit des dépendances doit tourner même quand personne ne
  # contribue : une faille publiée en amont n'attend pas la prochaine PR.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Lecture seule : aucun job n'a besoin d'écrire sur le dépôt.
permissions:
  contents: read

# Une PR poussée plusieurs fois d'affilée n'a pas besoin de voir ses
# anciens runs finir.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Doit rester égal à TYGO_VERSION dans le Makefile : le contrôle de
  # dérive compare une génération locale à une génération CI, deux
  # versions différentes le feraient échouer à tort.
  TYGO_VERSION: 'v0.2.21'

jobs:
  go:
    name: Go — lint et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Installer les dépendances du front
        run: npm ci
        working-directory: web

      # Version épinglée : un lint qui change de règles tout seul entre
      # deux exécutions transforme une PR verte en PR rouge sans que
      # rien n'ait bougé côté code.
      - name: Installer golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      # `make lint` vérifie aussi la dérive des types générés, et cette
      # vérification a besoin de tygo. Même exigence d'outillage que le
      # linter lui-même : la cible échoue franchement s'il manque, plutôt
      # que de sauter le contrôle en silence.
      - name: Installer tygo
        run: go install github.com/gzuidhof/tygo@${{ env.TYGO_VERSION }}

      - name: Lint
        run: make lint

      # -race exige cgo, activé explicitement : les images de runner
      # l'ont, mais CGO_ENABLED peut valoir 0 selon le contexte.
      - name: Tests
        run: make test
        env:
          CGO_ENABLED: '1'

  web:
    name: Front — lint et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installer les dépendances
        run: npm ci
        working-directory: web

      - name: Lint
        run: npm run lint
        working-directory: web

      - name: Tests
        run: npm run test:run
        working-directory: web

  # Job distinct des tests : une CVE publiée en amont n'a rien à voir
  # avec la PR en cours, et son échec ne doit pas se lire comme « ta
  # contribution est cassée ». Le check porte son propre nom, et le
  # déclencheur planifié le fait tourner même sans contribution.
  audit:
    name: Audit des dépendances du front
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installer les dépendances
        run: npm ci
        working-directory: web

      # Seuil `high` : les niveaux inférieurs produisent trop de bruit
      # pour un outil de développement qui ne traite aucune donnée
      # réelle. Même seuil que la cible `make web-test`.
      - name: Audit
        run: npm run audit:high
        working-directory: web

  # Les scénarios tournent dans les deux modes de stockage.
  #
  # Ils ne couvraient que SQLite, alors que le mode mémoire est le défaut
  # de l'image : un `docker run` sans configuration n'était donc exercé
  # nulle part. C'est ainsi qu'a survécu un défaut où l'API répondait
  # « liste vide » sur des alias existants et « 404 » sur un token
  # pourtant débitable — le mode le plus utilisé était le seul non testé.
  scenarios:
    name: Scénarios canoniques
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Installer les dépendances du front
        run: npm ci
        working-directory: web

      - name: Construire le binaire
        run: make build

      # Récepteur jetable : sans cible qui répond, chaque livraison
      # échoue et l'historique ne reflète plus un parcours réaliste.
      - name: Démarrer un récepteur de webhooks
        run: |
          cat > /tmp/sink.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class H(BaseHTTPRequestHandler):
              def do_POST(self):
                  self.rfile.read(int(self.headers.get('Content-Length', 0)))
                  self.send_response(200)
                  self.end_headers()
              def log_message(self, *a):
                  pass
          HTTPServer(('127.0.0.1', 9099), H).serve_forever()
          PY
          python3 /tmp/sink.py &

      # Les deux modes de stockage, dans un seul job.
      #
      # SQLite reste indispensable : c'est le défaut de
      # deploy/compose.yml, et le mode où les défauts d'asynchronisme se
      # manifestent réellement — la course corrigée en v0.4.6 était
      # invisible en mémoire, donc invisible pour go test. La mémoire
      # s'y ajoute plutôt qu'elle ne le remplace, parce que c'est elle
      # que rencontre un `docker run` sans configuration.
      #
      # Une boucle plutôt qu'une matrice, pour que le nom du check reste
      # « Scénarios canoniques » quels que soient les modes couverts :
      # une matrice le suffixe, et chaque mode ajouté casserait alors la
      # protection de branche qui le référence. Le coût est de les jouer
      # en séquence — une quarantaine de secondes.
      - name: Exécuter les scénarios dans les deux modes
        run: |
          global=0
          for store in memory sqlite; do
            echo "::group::mode $store"
            rm -f /tmp/paysim-ci.db
            PAYSIM_PUBLIC_URL=http://127.0.0.1:8080 \
            PAYSIM_CALLBACK_URL=http://127.0.0.1:9099 \
            PAYSIM_PAYZEN_HMAC_KEY=dev-hmac-key \
            PAYSIM_PAYZEN_REST_PASSWORD=dev-rest-password \
            PAYSIM_STORE="$store" \
            PAYSIM_SQLITE_PATH=/tmp/paysim-ci.db \
            PAYSIM_LOG_LEVEL=warn \
            ./paysim &
            pid=$!

            up=0
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
                up=1
                break
              fi
              sleep 1
            done
            if [ "$up" -ne 1 ]; then
              echo "mode $store : Paysim n'a pas démarré"
              kill "$pid" 2>/dev/null
              global=$((global + 1))
              echo "::endgroup::"
              continue
            fi

            failed=0
            for f in examples/scenarios/*.yml; do
              if PAYSIM_URL=http://127.0.0.1:8080 ./paysim run "$f"; then
                echo "OK    $(basename "$f")"
              else
                echo "ECHEC $(basename "$f")"
                failed=$((failed + 1))
              fi
            done

            kill "$pid" 2>/dev/null
            wait "$pid" 2>/dev/null
            if [ "$failed" -ne 0 ]; then
              echo "mode $store : $failed scenario(s) en echec"
              global=$((global + 1))
            else
              echo "mode $store : tous les scenarios passent"
            fi
            echo "::endgroup::"
          done

          if [ "$global" -ne 0 ]; then
            echo "$global mode(s) en echec"
            exit 1
          fi
          echo "Les deux modes passent"

  # Les types TypeScript de l'API sont générés depuis les DTOs Go, mais
  # rien ne lançait la génération : `make web-types` n'est appelé par
  # aucune autre cible, et la brancher sur `web-build` casserait l'image
  # (le stage Node du Dockerfile n'a ni Go ni tygo).
  #
  # Résultat : trois livraisons d'affilée ont modifié des types Go sans
  # régénérer, et le front ignorait jusqu'au type de `detailedErrorCode`
  # qu'on venait de livrer. Ce job ne corrige rien, il refuse de laisser
  # passer — comme `gofmt -l`.
  types:
    name: Types générés à jour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Installer tygo
        run: go install github.com/gzuidhof/tygo@${{ env.TYGO_VERSION }}

      # Même cible qu'en local, et non un diff réécrit ici : deux
      # définitions du même contrôle finissent par diverger, et c'est la
      # version YAML qu'on ne peut pas essayer avant de pousser.
      - name: Vérifier l'absence de dérive
        run: make web-types-check

  # Image `edge` : l'état de master, publié à chaque fusion.
  #
  # Elle existe pour qu'un correctif soit installable sans passer par une
  # release. Publier une version a un coût — tag, notes, annonce — et le
  # payer pour chaque correctif produit une page de releases illisible où
  # l'urgent et l'accessoire se ressemblent.
  #
  #   :latest → dernière version stable, publiée à la main
  #   :edge   → état de master, mis à jour tout seul
  #
  # Multi-architecture comme `latest`, et pour la même raison : construire
  # les deux à chaque fusion garantit que l'arm64 compile toujours, au
  # lieu de le découvrir au moment d'une release. Le Dockerfile
  # cross-compile depuis la plateforme de build, donc aucune émulation
  # QEMU n'entre en jeu — le coût du second arc est marginal.
  edge:
    name: Image edge
    runs-on: ubuntu-latest
    # Seulement sur master : une PR ne doit jamais publier d'image.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # Rien ne part au registre tant que la validation n'est pas verte.
    needs: [go, web, audit, scenarios, types]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Se connecter au registre
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:edge
          # Sans ça, l'image ne dit pas de quel commit elle sort — le
          # défaut du Dockerfile (`unknown`) resterait en place.
          build-args: |
            REVISION=${{ github.sha }}
          # Le cache du registre évite de tout reconstruire à chaque
          # fusion — le front et les dépendances Go bougent rarement.
          cache-from: type=gha
          cache-to: type=gha,mode=max
