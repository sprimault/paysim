<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <!-- Favicon SVG inline (data URI) — icône éclair Lucide dans la
         palette brand indigo, cohérent avec le logo Header. Data URI
         évite le problème de chemin quand Paysim est servi sous un
         base path (ingress avec préfixe). -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'%3E%3Cpath d='M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z'/%3E%3C/svg%3E" />
    <title>Paysim</title>
    <!-- __PAYSIM_BASE_PATH__ est remplacé par le binaire Go au moment
         du serve. Cette ligne reste telle quelle en dev (Vite ne la
         touche pas) — getBasePath() retombe alors sur "" et le proxy
         Vite gère la redirection vers l'API. -->
    <script>window.__PAYSIM_BASE_PATH__ = "__PAYSIM_BASE_PATH__";</script>
    <!-- Scripts synchrones exécutés avant le bundle module (type=module
         = defer par défaut) pour éviter le flash visuel dark/lang. Code
         dans web/public/paysim-preinit.js pour rester lisible. -->
    <script src="./paysim-preinit.js"></script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
