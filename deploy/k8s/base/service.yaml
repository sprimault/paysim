apiVersion: v1
kind: Service
metadata:
  name: paysim
  namespace: paysim
  labels:
    app.kubernetes.io/name: paysim
spec:
  # NodePort pour un accès direct depuis le réseau du cluster, sans
  # ingress — un outil de dev qu'on ajoute au cluster et qu'on
  # consomme depuis un poste sur le même LAN. Un dev qui veut
  # exposer sur un domaine public active l'Ingress optionnel
  # (voir ingress.yaml).
  type: NodePort
  selector:
    app.kubernetes.io/name: paysim
  ports:
    - name: http
      port: 8080
      targetPort: http
      # Modifiable ; K8s exige un port dans la plage 30000-32767
      # par défaut. Le port 30880 est laissé libre pour Docker Compose
      # (défaut du quick start), le cluster prend 30890 pour cohabiter.
      nodePort: 30890
      protocol: TCP
