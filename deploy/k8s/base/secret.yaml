# ⚠ Ce fichier est un TEMPLATE. Ne JAMAIS commiter les vraies valeurs
# dans votre dépôt — utiliser sealed-secrets, SOPS, external-secrets,
# ou tout autre mécanisme de gestion de secrets adapté à votre cluster.
#
# Pour tester rapidement, remplir stringData et appliquer manuellement.
# Pour la production, générer ce fichier depuis votre coffre-fort.
apiVersion: v1
kind: Secret
metadata:
  name: paysim
  namespace: paysim
type: Opaque
stringData:
  # PayZen signe avec deux clés distinctes selon le canal, et annonce
  # laquelle dans le champ kr-hash-key du POST :
  #
  #   sha256_hmac → retour navigateur    → PAYSIM_PAYZEN_HMAC_KEY
  #   password    → notification serveur → PAYSIM_PAYZEN_REST_PASSWORD
  #
  # Les deux sont obligatoires : sans la seconde, le pod refuse de
  # démarrer. Signer les notifications avec la clé du navigateur
  # laisserait le marchand valider un chemin que la production
  # n'emprunte pas — son IPN de production échouerait alors qu'il
  # passait ici. Générer chacune avec : openssl rand -hex 32
  PAYSIM_PAYZEN_HMAC_KEY: ""
  PAYSIM_PAYZEN_REST_PASSWORD: ""

  # Bearer token qui protège l'API de contrôle (/paysim/simulate/*
  # et /paysim/api/v1/*). Laisser vide pour désactiver l'auth (mode
  # local uniquement, non recommandé sur un cluster partagé).
  # Générer avec : openssl rand -base64 32
  PAYSIM_API_TOKEN: ""
